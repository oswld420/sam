              <div className="slide-section mx-auto mt-8 max-w-xl rounded-3xl border border-rose-200 bg-white/95 p-7 sm:p-8 shadow-lg backdrop-blur-md relative overflow-hidden text-left">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-script text-2xl text-rose-500">buzon</span>
                  <span className="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-full font-medium border border-rose-100 flex items-center gap-1"><span>💌</span> Llega a mi correo</span>
                </div>

                <h2 className="font-romantic text-2xl sm:text-3xl font-bold text-neutral-900 mb-2">Escríbeme algo que quieras decirme hoy</h2>
                <p className="text-xs sm:text-sm text-neutral-600 font-light mb-5">Escribe lo que sientes, lo que te pasó hoy o lo que quieras compartir conmigo. Cuando le des a enviar, me llegará 💕</p>

                <form onSubmit={handleSendSamMessage} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-500 mb-2 uppercase tracking-wider">¿Cómo te sientes o de qué trata tu mensaje?</label>
                    <div className="flex flex-wrap gap-2">
                      {['❤️ Te amo mucho', '🥺 Te extraño', '✨ Mi día hoy', '💌 Mensajito especial', '🥰 Solo pensando en ti'].map((moodOption) => (
                        <button key={moodOption} type="button" onClick={() => setSamMood(moodOption)} className={`rounded-full px-3 py-1.5 text-xs font-medium transition-all cursor-pointer ${samMood === moodOption ? 'bg-rose-500 text-white shadow-sm scale-105 font-semibold' : 'bg-rose-50 text-neutral-700 hover:bg-rose-100 border border-rose-100'}`}>{moodOption}</button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-neutral-500 mb-1.5 uppercase tracking-wider">Tu mensaje para mí:</label>
                    <textarea rows={4} value={samMessage} onChange={(e) => setSamMessage(e.target.value)} placeholder="Escribe aquí lo que sientas, Sam... estoy para escucharte ❤️" className="w-full rounded-2xl border border-rose-200 bg-[#FCFBF9] p-4 text-sm text-neutral-800 placeholder-neutral-400 focus:border-rose-400 focus:bg-white focus:outline-none resize-none" required />
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-1">
                    <button type="submit" disabled={isSendingSamMsg} className="rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 px-5 py-2.5 text-xs font-semibold text-white shadow-md hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-70">{isSendingSamMsg ? 'Enviando...' : 'Enviar a mi correo 💌'}</button>
                    <p className="text-[11px] text-neutral-500 italic">Lo que escribas me llega directamente 💕</p>
                  </div>
                </form>

                {samMsgFeedback && (
                  <div className="mt-4 rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-800">📩 <strong>¡Listo!</strong> Tu mensaje se mandó y lo leí con mucho cariño 💖</div>
                )}
              </div>
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
