<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Sam | Nuestro Rincón de Amor</title>
  <meta name="description" content="Un rincón íntimo y romántico con cartas de amor, fotos, videos y un frasco interactivo de frases para Sam.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <!-- React & ReactDOM & Babel for standalone in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-romantic {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .font-script {
      font-family: 'Alex Brush', cursive;
    }
    .letter-paper {
      background-color: #FAF5EE;
      background-image: radial-gradient(#E8DCCD 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
    .jar-glow {
      box-shadow: 0 0 35px rgba(254, 205, 211, 0.6), inset 0 0 25px rgba(255, 255, 255, 0.6);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-disc {
      animation: spinDisc 6s linear infinite;
    }
  </style>
</head>
<body class="bg-[#FFFDFC] text-neutral-800 antialiased selection:bg-rose-200 selection:text-rose-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // URL de audio en streaming web directo (El Libro de la Vida - Te Amo y Más por Diego Luna)
    const DEFAULT_SONG_URL = "https://cdn.jsdelivr.net/gh/luisfernandoumiriflores-art/Te-amo-y-mas.@main/El%20Libro%20De%20La%20Vida%20-%20Te%20Amo%20Y%20M%C3%A1s%20(Letra)%20Diego%20Luna.mp3";

    // Notas de papel enrolladas y dobladas que llenan visualmente el frasco
    const JAR_DECORATIVE_PAPERS = [
      { id: 'p1', left: '16%', bottom: '12px', rot: '-14deg', color: 'from-rose-200 to-rose-300', text: 'Te amo Sam ❤️' },
      { id: 'p2', left: '38%', bottom: '16px', rot: '8deg', color: 'from-pink-200 to-rose-200', text: 'Mi princesa 🌸' },
      { id: 'p3', left: '62%', bottom: '10px', rot: '-6deg', color: 'from-amber-100 to-rose-200', text: 'Mi universo 🌌' },
      { id: 'p4', left: '26%', bottom: '34px', rot: '18deg', color: 'from-rose-300 to-pink-300', text: 'Tus ojos bellos 👀' },
      { id: 'p5', left: '50%', bottom: '38px', rot: '-16deg', color: 'from-fuchsia-200 to-pink-200', text: 'Siempre juntos ✨' },
      { id: 'p6', left: '14%', bottom: '60px', rot: '12deg', color: 'from-pink-200 to-rose-300', text: 'Eres mi paz 🕊️' },
      { id: 'p7', left: '66%', bottom: '58px', rot: '-12deg', color: 'from-rose-200 to-amber-100', text: 'Mi niña hermosa 💕' },
      { id: 'p8', left: '36%', bottom: '78px', rot: '-8deg', color: 'from-rose-100 to-pink-200', text: 'Nuestra canción 🎶' },
      { id: 'p9', left: '54%', bottom: '96px', rot: '14deg', color: 'from-pink-300 to-rose-200', text: 'Besos para ti 💋' },
      { id: 'p10', left: '18%', bottom: '112px', rot: '-18deg', color: 'from-amber-200 to-rose-200', text: 'Solo tú y yo 🔐' },
      { id: 'p11', left: '60%', bottom: '126px', rot: '22deg', color: 'from-rose-200 to-fuchsia-200', text: 'Por siempre 💍' },
      { id: 'p12', left: '32%', bottom: '142px', rot: '-10deg', color: 'from-pink-200 to-rose-300', text: 'Mi vida entera 💖' },
      { id: 'p13', left: '52%', bottom: '162px', rot: '8deg', color: 'from-rose-300 to-pink-200', text: 'Te amo y más 🎵' },
      { id: 'p14', left: '16%', bottom: '178px', rot: '16deg', color: 'from-pink-100 to-rose-200', text: 'Dueña de mí 👑' },
      { id: 'p15', left: '64%', bottom: '188px', rot: '-14deg', color: 'from-rose-200 to-amber-200', text: 'Amor eterno ♾️' },
      { id: 'p16', left: '38%', bottom: '208px', rot: '12deg', color: 'from-fuchsia-200 to-pink-300', text: 'Mi Sam preciosa 💌' }
    ];

    const INITIAL_LETTERS = [
      {
        id: '1',
        title: 'Para el amor de mi vida: Sam',
        date: 'Siempre en mi corazón',
        category: 'romantica',
        content: `Mi Sam hermosa,

No hay un solo día en que no agradezca haberte encontrado. Llegaste a mi vida a poner orden en mi caos, a enseñarme lo que significa querer de verdad y con el alma. 

Amo cada detalle tuyo: tu risa contagiosa, la forma en que miras cuando algo te emociona, tu dulzura y hasta cuando te pones tímida. Eres mi lugar seguro, mi casa, y la persona con la que quiero compartir cada amanecer.

Esta página es solo un pedacito de lo mucho que significas para mí. Te amo con todo mi ser.`
      },
      {
        id: '2',
        title: 'El día en que supe que eras tú',
        date: 'Un recuerdo imborrable',
        category: 'recuerdo',
        content: `Recuerdo con tanta claridad las primeras veces que hablamos, la primera vez que te vi y cómo mi corazón empezó a latir a un ritmo que nunca antes había sentido.

Fue en ese momento exacto cuando entendí que no quería a nadie más. Quería caminar contigo, aprender contigo, reír hasta que nos doliera la panza y superar cualquier obstáculo tomados de la mano. Eres mi presente favorito y mi futuro soñado.`
      },
      {
        id: '3',
        title: 'Mis promesas para nosotros',
        date: 'Un pacto de amor',
        category: 'promesa',
        content: `Prometo escucharte cuando lo necesites, abrazarte fuerte cuando el mundo afuera sea difícil, y festejar cada uno de tus logros como si fuera mío.

Prometo no dejar de recordarte lo hermosa que estás, ni cansarme de decirte "te amo". Juntos podemos con todo, mi amor. Gracias por elegirme.`
      }
    ];

    // =========================================================================
    // 💌 FRASES DEL FRASCO (AGREGA O EDITA TUS FRASES DIRECTAMENTE AQUÍ):
    // =========================================================================
    const INITIAL_QUOTES = [
      { id: '1', text: 'Si tuviera que elegirte de nuevo entre un millón de vidas, te elegiría en cada una sin dudarlo.', tag: 'Eternidad' },
      { id: '2', text: 'Tu sonrisa es mi notificación favorita y la cura perfecta para cualquier mal día.', tag: 'Felicidad' },
      { id: '3', text: 'Eres ese pensamiento bonito que me saca una sonrisa tonta en medio de la nada.', tag: 'Dulzura' },
      { id: '4', text: 'Te amo no por lo que eres, sino por lo que soy cuando estoy a tu lado, mi hermosa Sam.', tag: 'Amor puro' },
      { id: '5', text: 'El amor no se mira con los ojos, se siente con el alma, y mi alma te reconoce a ti.', tag: 'Conexión' },
      { id: '6', text: 'Me gusta tu voz, tu risa, tus ojos y la forma en la que iluminas cualquier lugar donde estás.', tag: 'Admiración' },
      { id: '7', text: 'Abrazarte es sentir que todo está bien, que no me falta nada y que estoy en casa.', tag: 'Paz' },
      { id: '8', text: 'No hay poema ni canción que alcance a describir lo mucho que me gustas cada día más.', tag: 'Poesía' },
      { id: '9', text: 'Gracias por ser mi cómplice, mi paz y la dueña de mi corazón. Te amo con locura, Sam.', tag: 'Gratitud' },
      { id: '10', text: 'Un recordatorio rápido por si se te olvidaba: ¡Eres la persona más hermosa del universo entero!', tag: 'Mimos' }
    ];

    // =========================================================================
    // 📸 TUS FOTOS CON SAM (LA FORMA MÁS FÁCIL: ETIQUETAS <img src="...">):
    //
    // ¡Aquí agregas tus fotos exactamente como querías!
    // Solo escribe o copia y pega la etiqueta <img src="..." alt="...">
    // o simplemente el nombre de tu archivo.
    //
    // 💡 NOTA: Para que se vean en tu computadora o celular,
    // guarda los archivos de las fotos en la misma carpeta donde tengas este index.html.
    // =========================================================================
    const MIS_FOTOS_CODIGO = [
      '<img src="WhatsApp Image 2025-11-27 at 8.05.18 PM (1).jpeg" alt="Proceso 1">',
      // Agrega más fotos aquí abajo copiando esta misma línea:
      // '<img src="WhatsApp Image 2025-11-27 at 8.05.18 PM (2).jpeg" alt="Nuestro recuerdo juntos">',
      // '<img src="foto1.jpg" alt="Sonriendo a tu lado">',
    ];

    // Fotos de respaldo románticas en caso de que aún no hayas añadido tus fotos personales
    const DEFAULT_FALLBACK_PHOTOS = [
      {
        id: 'fb-1',
        url: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80',
        caption: 'Nuestras manos entrelazadas: el lugar perfecto donde pertenezco.',
        date: 'Un atardecer contigo',
        location: 'Nuestro rincón favorito'
      },
      {
        id: 'fb-2',
        url: 'https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=800&q=80',
        caption: 'Todas las flores del mundo no se comparan con tu belleza, mi Sam.',
        date: 'Detalles que te mereces',
        location: 'De mí para ti'
      }
    ];

    // Helper que convierte tanto etiquetas <img src="..."> como nombres de archivo u objetos
    function parsearFotosDesdeCodigo(lista) {
      if (!Array.isArray(lista) || lista.length === 0) return [];
      return lista.map((item, index) => {
        if (!item) return null;
        if (typeof item === 'string') {
          const str = item.trim();
          if (str.includes('<img') || str.includes('src=')) {
            const srcMatch = str.match(/src=["']([^"']+)["']/i);
            const altMatch = str.match(/alt=["']([^"']+)["']/i);
            const url = srcMatch ? srcMatch[1] : str;
            const caption = altMatch ? altMatch[1] : 'Nuestro momento especial con Sam ❤️';
            return {
              id: `code-${index}-${encodeURIComponent(url).slice(-10)}`,
              url: url,
              caption: caption,
              date: 'Recuerdo de amor',
              location: 'Juntos',
              isFromCode: true
            };
          }
          return {
            id: `code-${index}-${encodeURIComponent(str).slice(-10)}`,
            url: str,
            caption: 'Nuestro momento especial con Sam ❤️',
            date: 'Recuerdo de amor',
            location: 'Juntos',
            isFromCode: true
          };
        }
        if (typeof item === 'object') {
          return {
            id: item.id || `code-${index}`,
            url: item.url || item.src || '',
            caption: item.caption || item.alt || 'Momento especial ❤️',
            date: item.date || 'Recuerdo',
            location: item.location || 'Juntos',
            isFromCode: true
          };
        }
        return null;
      }).filter(Boolean);
    }

    const INITIAL_VIDEOS = [
      {
        id: '1',
        title: 'Te Amo y Más (El Libro de la Vida)',
        url: 'https://www.youtube.com/embed/QAItMep0GiA',
        caption: '“Te amo y más de lo que puedes imaginar, te amo además como nunca nadie jamás te amará...” Nuestra canción para ti, Sam ❤️',
        date: 'Nuestra Canción Especial',
        type: 'embed'
      },
      {
        id: '2',
        title: 'Nuestros Momentos Juntos',
        url: 'https://assets.mixkit.co/videos/preview/mixkit-hands-of-a-couple-under-the-sun-41398-large.mp4',
        caption: 'Un vistazo a la magia que sentimos cuando estamos juntos.',
        date: 'Recuerdo grabado',
        type: 'url'
      }
    ];

    function App() {
      const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('sam_unlocked') === 'true');
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [isMusicPlaying, setIsMusicPlaying] = useState(false);
      const [songUrl, setSongUrl] = useState(DEFAULT_SONG_URL);
      const songTitle = 'Te amo y más (Diego Luna)';
      const [musicVolume, setMusicVolume] = useState(0.85);
      const [isMuted, setIsMuted] = useState(false);
      const audioRef = useRef(null);

      // Sincronizar volumen con el elemento audio
      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : musicVolume;
        }
      }, [musicVolume, isMuted]);

      // Main State
      const [letters, setLetters] = useState(() => {
        const saved = localStorage.getItem('sam_letters');
        return saved ? JSON.parse(saved) : INITIAL_LETTERS;
      });
      // Las frases del frasco se toman directamente del código para que Sam las lea
      const quotes = INITIAL_QUOTES;
      // Fotos procesadas desde el código (admite etiquetas <img src="..."> y nombres de archivo)
      const fotosDesdeCodigo = parsearFotosDesdeCodigo(MIS_FOTOS_CODIGO);
      // Las fotos se leen de almacenamiento local o directamente de las fotos del código
      const [photos, setPhotos] = useState(() => {
        const saved = localStorage.getItem('sam_photos');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch (e) {}
        }
        if (fotosDesdeCodigo.length > 0) return fotosDesdeCodigo;
        return DEFAULT_FALLBACK_PHOTOS;
      });
      // Registro de fotos que no se encuentran en la carpeta para mostrar ayuda visual
      const [brokenPhotos, setBrokenPhotos] = useState({});
      const [videos, setVideos] = useState(() => {
        const saved = localStorage.getItem('sam_videos');
        return saved ? JSON.parse(saved) : INITIAL_VIDEOS;
      });
      const [anniversaryDate, setAnniversaryDate] = useState(() => {
        return localStorage.getItem('sam_anniversary') || '2024-02-14';
      });

      // Modals
      const [selectedLetter, setSelectedLetter] = useState(null);
      const [isWriteLetterOpen, setIsWriteLetterOpen] = useState(false);
      const [currentQuoteNote, setCurrentQuoteNote] = useState(null);
      const [activePhoto, setActivePhoto] = useState(null);
      const [isUploadPhotoOpen, setIsUploadPhotoOpen] = useState(false);
      const [selectedVideo, setSelectedVideo] = useState(videos[0]);
      const [isUploadVideoOpen, setIsUploadVideoOpen] = useState(false);

      // New letter form
      const [newLetterTitle, setNewLetterTitle] = useState('');
      const [newLetterCategory, setNewLetterCategory] = useState('romantica');
      const [newLetterContent, setNewLetterContent] = useState('');

      // New photo form
      const [newPhotoCaption, setNewPhotoCaption] = useState('');
      const [newPhotoDate, setNewPhotoDate] = useState('');
      const [newPhotoLocation, setNewPhotoLocation] = useState('');
      const [newPhotoUrl, setNewPhotoUrl] = useState('');

      // New video form
      const [newVideoTitle, setNewVideoTitle] = useState('');
      const [newVideoCaption, setNewVideoCaption] = useState('');
      const [newVideoUrl, setNewVideoUrl] = useState('');

      // Sam message form
      const [samMessage, setSamMessage] = useState('');
      const [samMessageStatus, setSamMessageStatus] = useState('');

      // Time together counter
      const [timeTogether, setTimeTogether] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      useEffect(() => {
        const calculateTime = () => {
          const start = new Date(anniversaryDate).getTime();
          const now = new Date().getTime();
          const diff = Math.max(0, now - start);
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / 1000 / 60) % 60);
          const seconds = Math.floor((diff / 1000) % 60);
          setTimeTogether({ days, hours, minutes, seconds });
        };
        calculateTime();
        const interval = setInterval(calculateTime, 1000);
        return () => clearInterval(interval);
      }, [anniversaryDate]);

      // Password logic: te amo sam o sam
      const handleLogin = (e) => {
        e.preventDefault();
        const clean = passwordInput.trim().toLowerCase();
        if (clean === 'te amo sam' || clean === 'sam' || clean === 'teamosam') {
          setUnlocked(true);
          sessionStorage.setItem('sam_unlocked', 'true');
          confetti({
            particleCount: 120,
            spread: 90,
            origin: { y: 0.6 }
          });
        } else {
          setPasswordError('Pista: escribe "te amo sam" ❤️');
        }
      };

      // Control de reproducción de música sin encimarse
      const handleToggleMusic = () => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isMusicPlaying) {
          audio.pause();
          setIsMusicPlaying(false);
        } else {
          audio.play().then(() => {
            setIsMusicPlaying(true);
          }).catch(err => {
            console.warn("Intento de autoplay o error de origen:", err);
            if (audio.src !== BACKUP_SONG_URL) {
              audio.src = BACKUP_SONG_URL;
              audio.play().then(() => setIsMusicPlaying(true)).catch(e => console.error(e));
            }
          });
        }
      };

      const pullQuoteFromJar = () => {
        if (!quotes.length) return;
        confetti({
          particleCount: 30,
          spread: 50,
          origin: { y: 0.65 },
          colors: ['#FDA4AF', '#F43F5E', '#FDE047']
        });
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        setCurrentQuoteNote(randomQuote);
      };

      // Persistence sync
      const saveAndSetLetters = (arr) => {
        setLetters(arr);
        localStorage.setItem('sam_letters', JSON.stringify(arr));
      };
      const saveAndSetPhotos = (arr) => {
        setPhotos(arr);
        localStorage.setItem('sam_photos', JSON.stringify(arr));
      };

      // Carga directa de fotos desde el celular o computadora (convierte a base64 y guarda)
      const handleDirectFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        let loaded = 0;
        const newUploaded = [];
        files.forEach((file, index) => {
          const reader = new FileReader();
          reader.onload = () => {
            newUploaded.push({
              id: `upload-${Date.now()}-${index}-${Math.random().toString(36).substr(2, 4)}`,
              url: reader.result,
              caption: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ') || 'Nuestro momento juntos ❤️',
              date: new Date().toLocaleDateString('es-ES', { month: 'short', day: 'numeric', year: 'numeric' }),
              location: 'Juntos',
              isCustom: true
            });
            loaded++;
            if (loaded === files.length) {
              const updated = [...newUploaded, ...photos];
              saveAndSetPhotos(updated);
              confetti({
                particleCount: 50,
                spread: 70,
                origin: { y: 0.6 }
              });
            }
          };
          reader.readAsDataURL(file);
        });
      };

      const handleDeletePhoto = (idToDelete) => {
        const updated = photos.filter(p => p.id !== idToDelete);
        saveAndSetPhotos(updated);
      };

      const handleResetPhotos = () => {
        localStorage.removeItem('sam_photos');
        setPhotos(fotosDesdeCodigo.length > 0 ? fotosDesdeCodigo : DEFAULT_FALLBACK_PHOTOS);
        setBrokenPhotos({});
      };
      const saveAndSetVideos = (arr) => {
        setVideos(arr);
        localStorage.setItem('sam_videos', JSON.stringify(arr));
      };

      if (!unlocked) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-[#FFF5F5] via-[#FFF0F3] to-[#FFE4E6] p-4">
            <div className="w-full max-w-md rounded-2xl bg-white/85 p-8 shadow-2xl backdrop-blur-md border border-rose-100 text-center">
              <div className="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-rose-50 text-rose-500 shadow-inner">
                <span className="text-4xl">❤️</span>
              </div>
              <p className="font-script text-2xl text-rose-500 mb-1">Para mi persona favorita</p>
              <h1 className="font-romantic text-3xl font-bold text-neutral-900 mb-2">Nuestro Rincón Secreto</h1>
              <p className="text-sm text-neutral-600 mb-6 font-light">
                Este rincón fue creado con todo mi amor solo para ti, Sam. Ingresa la contraseña para desbloquearlo.
              </p>
              <form onSubmit={handleLogin} className="space-y-4">
                <div className="text-left">
                  <label className="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1.5 ml-1">
                    Contraseña de amor
                  </label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                      placeholder="Escribe la frase secreta..."
                      className="w-full rounded-xl border border-rose-200 bg-white/90 px-4 py-3 text-sm focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-200"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-3 text-xs text-neutral-400 hover:text-neutral-700"
                    >
                      {showPassword ? 'Ocultar' : 'Ver'}
                    </button>
                  </div>
                  {passwordError && (
                    <p className="text-xs text-rose-600 mt-2 font-medium">{passwordError}</p>
                  )}
                </div>
                <button
                  type="submit"
                  className="w-full rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 py-3 text-sm font-semibold text-white shadow-lg shadow-rose-200 hover:from-rose-600 hover:to-rose-700 active:scale-95 transition-all cursor-pointer"
                >
                  Abrir mi corazón ❤️
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#FFFDFC]">
          {/* Elemento de Audio Nativo Web */}
          <audio
            ref={audioRef}
            src={songUrl}
            preload="auto"
            loop
            onPlay={() => setIsMusicPlaying(true)}
            onPause={() => setIsMusicPlaying(false)}

                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsWriteLetterOpen(false)} className="rounded-xl px-4 py-2 text-xs text-neutral-600 cursor-pointer">Cancelar</button>
                    <button type="submit" className="rounded-xl bg-rose-600 px-5 py-2 text-xs font-semibold text-white hover:bg-rose-700 cursor-pointer">Guardar carta</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Photo Upload */}
          {isUploadPhotoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setIsUploadPhotoOpen(false)}>
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <h3 className="font-romantic text-2xl font-bold text-neutral-900 mb-1">Agregar Foto para Sam</h3>
                <p className="text-xs text-neutral-500 mb-4">Puedes seleccionar el archivo o pegar la etiqueta &lt;img src="..."&gt;</p>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newPhotoUrl) return;
                  let finalUrl = newPhotoUrl.trim();
                  let finalCaption = newPhotoCaption.trim();

                  if (finalUrl.includes('<img') || finalUrl.includes('src=')) {
                    const srcMatch = finalUrl.match(/src=["']([^"']+)["']/i);
                    const altMatch = finalUrl.match(/alt=["']([^"']+)["']/i);
                    if (srcMatch) finalUrl = srcMatch[1];
                    if (altMatch && !finalCaption) finalCaption = altMatch[1];
                  }

                  saveAndSetPhotos([{
                    id: String(Date.now()),
                    url: finalUrl,
                    caption: finalCaption || 'Un momento inolvidable contigo ❤️',
                    date: newPhotoDate || 'Hoy y siempre',
                    location: newPhotoLocation || 'Juntos'
                  }, ...photos]);
                  setNewPhotoUrl('');
                  setNewPhotoCaption('');
                  setIsUploadPhotoOpen(false);
                }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">1. Seleccionar archivo desde tu dispositivo</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = () => {
                            setNewPhotoUrl(reader.result);
                            if (!newPhotoCaption) {
                              setNewPhotoCaption(file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '));
                            }
                          };
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="block w-full text-xs text-neutral-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-rose-50 file:text-rose-700 cursor-pointer"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">2. O escribe la etiqueta &lt;img&gt;, nombre de archivo o enlace web</label>
                    <input
                      type="text"
                      placeholder='Ej: <img src="WhatsApp Image..." alt="Dedicatoria"> o fotos/foto1.jpg o https://...'
                      value={newPhotoUrl || ''}
                      onChange={e => {
                        const val = e.target.value;
                        if (val.includes('<img') || val.includes('src=')) {
                          const srcM = val.match(/src=["']([^"']+)["']/i);
                          const altM = val.match(/alt=["']([^"']+)["']/i);
                          if (srcM) {
                            setNewPhotoUrl(srcM[1]);
                            if (altM && !newPhotoCaption) {
                              setNewPhotoCaption(altM[1]);
                            }
                            return;
                          }
                        }
                        setNewPhotoUrl(val);
                      }}
                      className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                    />
                  </div>
                  {newPhotoUrl && (
                    <div className="h-32 w-full rounded-lg overflow-hidden border">
                      <img src={newPhotoUrl} className="w-full h-full object-cover" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">Dedicatoria para Sam</label>
                    <input
                      type="text"
                      value={newPhotoCaption}
                      onChange={e => setNewPhotoCaption(e.target.value)}
                      placeholder="Ej: Proceso 1, Nuestro momento especial..."
                      className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsUploadPhotoOpen(false)} className="rounded-lg px-3 py-1.5 text-xs text-neutral-600 cursor-pointer">Cancelar</button>
                    <button type="submit" disabled={!newPhotoUrl} className="rounded-lg bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white disabled:opacity-50 cursor-pointer hover:bg-rose-700">Guardar foto</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Video Upload */}
          {isUploadVideoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setIsUploadVideoOpen(false)}>
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <h3 className="font-romantic text-2xl font-bold text-neutral-900 mb-4">Subir Video para Sam</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newVideoUrl) return;
                  let finalUrl = newVideoUrl;
                  let finalType = 'url';
                  if (finalUrl.includes('youtube.com') || finalUrl.includes('youtu.be')) {
                    finalType = 'embed';
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = finalUrl.match(regExp);
                    if (match && match[2].length === 11) finalUrl = `https://www.youtube.com/embed/${match[2]}`;
                  }
                  saveAndSetVideos([{
                    id: String(Date.now()),
                    title: newVideoTitle || 'Momento especial grabado',
                    caption: newVideoCaption || 'Un instante que atesoro a tu lado.',
                    url: finalUrl,
                    date: new Date().toLocaleDateString('es-ES'),
                    type: finalType
                  }, ...videos]);
                  setNewVideoTitle('');
                  setNewVideoCaption('');
                  setNewVideoUrl('');
                  setIsUploadVideoOpen(false);
                }} className="space-y-3">
                  <input
                    type="text"
                    required
                    value={newVideoTitle}
                    onChange={e => setNewVideoTitle(e.target.value)}
                    placeholder="Título del video..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <input
                    type="text"
                    required
                    value={newVideoUrl}
                    onChange={e => setNewVideoUrl(e.target.value)}
                    placeholder="Enlace de YouTube o video MP4..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <textarea
                    rows={2}
                    value={newVideoCaption}
                    onChange={e => setNewVideoCaption(e.target.value)}
                    placeholder="¿Por qué este momento es especial?..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsUploadVideoOpen(false)} className="rounded-lg px-3 py-1.5 text-xs text-neutral-600 cursor-pointer">Cancelar</button>
                    <button type="submit" disabled={!newVideoUrl} className="rounded-lg bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white disabled:opacity-50 cursor-pointer hover:bg-rose-700">Guardar video</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Lightbox Photo */}
          {activePhoto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md" onClick={() => setActivePhoto(null)}>
              <div className="max-w-3xl w-full bg-white rounded-2xl p-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="max-h-[70vh] bg-neutral-950 rounded-xl overflow-hidden flex items-center justify-center">
                  <img src={activePhoto.url} className="max-h-[70vh] object-contain" />
                </div>
                <div className="mt-3 flex justify-between items-center">
                  <div>
                    <h3 className="font-romantic text-2xl font-bold text-neutral-900">{activePhoto.caption}</h3>
                    <p className="text-xs text-neutral-500">{activePhoto.date} · {activePhoto.location}</p>
                  </div>
                  <button onClick={() => setActivePhoto(null)} className="rounded-lg bg-neutral-900 px-4 py-2 text-xs text-white cursor-pointer">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-rose-100 bg-[#FAF7F5] py-8 px-4 text-center text-xs text-neutral-500 font-light">
            <p className="font-romantic text-lg font-bold text-neutral-800 mb-1">Para Sam ❤️</p>
            <p>Hecho con amor infinito, paciencia y cada latido de mi corazón.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
