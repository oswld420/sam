    // Sintetizador de audio de respaldo estilo cajita musical
    class RomanticAudioSynth {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 523.25, 587.33, 659.25];
        this.sequence = [
          [0, 2, 4, 6],
          [3, 5, 7, 8],
          [5, 0, 2, 4],
          [3, 1, 4, 6]
        ];
        this.seqIndex = 0;
        this.noteIndex = 0;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
          this.gain = this.ctx.createGain();
          this.gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          this.gain.connect(this.ctx.destination);
        }
      }
      playTone(freq, time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const oscHarmonic = this.ctx.createOscillator();
        const noteGain = this.ctx.createGain();

        osc.type = 'sine';
        oscHarmonic.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);
        oscHarmonic.frequency.setValueAtTime(freq * 2, time);

        noteGain.gain.setValueAtTime(0, time);
        noteGain.gain.linearRampToValueAtTime(0.2, time + 0.04);
        noteGain.gain.exponentialRampToValueAtTime(0.001, time + 1.6);

        osc.connect(noteGain);
        oscHarmonic.connect(noteGain);
        noteGain.connect(this.gain);

        osc.start(time);
        oscHarmonic.start(time);
        osc.stop(time + 1.6);
        oscHarmonic.stop(time + 1.6);
      }
      play() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isPlaying = true;
        const tick = () => {
          if (!this.isPlaying || !this.ctx) return;
          const currentChord = this.sequence[this.seqIndex];
          const noteOffset = currentChord[this.noteIndex % currentChord.length];
          const freq = this.notes[noteOffset % this.notes.length];
          this.playTone(freq, this.ctx.currentTime);
          this.noteIndex++;
          if (this.noteIndex % currentChord.length === 0) {
            this.seqIndex = (this.seqIndex + 1) % this.sequence.length;
          }
          this.timer = setTimeout(tick, 520);
        };
        tick();
      }
      pause() {
        this.isPlaying = false;
        if (this.timer) clearTimeout(this.timer);
      }
    }

                      type="text"
                      value={newQuoteTag}
                      onChange={(e) => setNewQuoteTag(e.target.value)}
                      placeholder="Ej. Ternura, Promesa, Beso"
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <button
                    onClick={() => {
                      if (!newQuoteText) return;
                      saveAndSetQuotes([{
                        id: Date.now().toString(),
                        text: newQuoteText,
                        tag: newQuoteTag || 'Amor'
                      }, ...quotes]);
                      setNewQuoteText('');
                      setIsAddQuoteOpen(false);
                      confetti({ particleCount: 40, spread: 60 });
                    }}
                    className="w-full rounded-xl bg-rose-600 py-3 text-xs font-semibold text-white hover:bg-rose-700 cursor-pointer"
                  >
                    Meter al frasco ✨
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: SUBIR FOTO */}
          {isAddPhotoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl text-left">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-romantic text-2xl font-bold text-neutral-900">Añadir recuerdo con foto</h3>
                  <button onClick={() => setIsAddPhotoOpen(false)} className="text-neutral-400 hover:text-neutral-700">✕</button>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-neutral-600 mb-1">URL de la foto o imagen</label>
                    <input
                      type="text"
                      value={newPhotoUrl}
                      onChange={(e) => setNewPhotoUrl(e.target.value)}
                      placeholder="https://ejemplo.com/nuestrafoto.jpg"
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-neutral-600 mb-1">Descripción o pensamiento</label>
                    <input
                      type="text"
                      value={newPhotoCaption}
                      onChange={(e) => setNewPhotoCaption(e.target.value)}
                      placeholder="Qué significa esta foto para ti..."
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-neutral-600 mb-1">Fecha</label>
                      <input
                        type="text"
                        value={newPhotoDate}
                        onChange={(e) => setNewPhotoDate(e.target.value)}
                        placeholder="Ej. Octubre 2026"
                        className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-neutral-600 mb-1">Lugar</label>
                      <input
                        type="text"
                        value={newPhotoLocation}
                        onChange={(e) => setNewPhotoLocation(e.target.value)}
                        placeholder="Ej. Juntos"
                        className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                      />
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      if (!newPhotoUrl) return;
                      saveAndSetPhotos([{
                        id: Date.now().toString(),
                        url: newPhotoUrl,
                        caption: newPhotoCaption || 'Un momento contigo ❤️',
                        date: newPhotoDate || 'Hoy',
                        location: newPhotoLocation || 'Nuestro rincón'
                      }, ...photos]);
                      setNewPhotoUrl('');
                      setNewPhotoCaption('');
                      setIsAddPhotoOpen(false);
                      confetti({ particleCount: 50, spread: 70 });
                    }}
                    className="w-full rounded-xl bg-rose-600 py-3 text-xs font-semibold text-white hover:bg-rose-700 cursor-pointer"
                  >
                    Guardar foto 📸
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: SUBIR VIDEO */}
          {isAddVideoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl text-left">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-romantic text-2xl font-bold text-neutral-900">Añadir video</h3>
                  <button onClick={() => setIsAddVideoOpen(false)} className="text-neutral-400 hover:text-neutral-700">✕</button>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-neutral-600 mb-1">Título del video o canción</label>
                    <input
                      type="text"
                      value={newVideoTitle}
                      onChange={(e) => setNewVideoTitle(e.target.value)}
                      placeholder="Ej. Te amo y más"
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-neutral-600 mb-1">URL de YouTube Embed</label>
                    <input
                      type="text"
                      value={newVideoUrl}
                      onChange={(e) => setNewVideoUrl(e.target.value)}
                      placeholder="https://www.youtube.com/embed/..."
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-neutral-600 mb-1">Dedicatoria</label>
                    <input
                      type="text"
                      value={newVideoCaption}
                      onChange={(e) => setNewVideoCaption(e.target.value)}
                      placeholder="Por qué este video es especial..."
                      className="w-full rounded-xl border border-neutral-300 p-2.5 text-sm"
                    />
                  </div>
                  <button
                    onClick={() => {
                      if (!newVideoUrl) return;
                      saveAndSetVideos([{
                        id: Date.now().toString(),
                        title: newVideoTitle || 'Canción para Sam',
                        url: newVideoUrl,
                        caption: newVideoCaption || 'Nuestra canción especial ❤️',
                        date: 'Hoy',
                        duration: 'Video'
                      }, ...videos]);
                      setNewVideoUrl('');
                      setNewVideoTitle('');
                      setNewVideoCaption('');
                      setIsAddVideoOpen(false);
                      confetti({ particleCount: 50, spread: 70 });
                    }}
                    className="w-full rounded-xl bg-rose-600 py-3 text-xs font-semibold text-white hover:bg-rose-700 cursor-pointer"
                  >
                    Guardar video 🎥
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
