    function App() {
      const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('sam_unlocked') === 'true');
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');

      const [isMusicPlaying, setIsMusicPlaying] = useState(false);

      const [isMuted, setIsMuted] = useState(false);
      const audioRef = useRef(null);

      // Sincronizar volumen con el elemento audio
      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : musicVolume;
        }
      }, [musicVolume, isMuted]);

        return saved ? JSON.parse(saved) : INITIAL_VIDEOS;
      });

        return localStorage.getItem('sam_anniversary') || '2024-02-14';

      // Modals

      const [newVideoUrl, setNewVideoUrl] = useState('');
      const [newVideoCaption, setNewVideoCaption] = useState('');

      const [missFeedback, setMissFeedback] = useState(false);
      const [heartFillLevel, setHeartFillLevel] = useState(() => Math.min(100, (parseInt(localStorage.getItem('sam_miss_count') || '0', 10)) * 20));

      const handleMissClick = async () => {
        if (isSendingMiss) return;
        const newCount = missCount + 1;
        setMissCount(newCount);
        localStorage.setItem('sam_miss_count', newCount);
        setHeartFillLevel(Math.min(100, heartFillLevel + 25));
        confetti({
          particleCount: 60,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#F43F5E', '#FB7185', '#FDA4AF', '#FFE4E6', '#E11D48']
        });
        setIsSendingMiss(true);
        try {
          await fetch('https://formsubmit.co/ajax/oswaldohernandezordonez7@gmail.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              _subject: '💌 ¡Sam te extraña! (Alerta de Amor desde su página)',
              Mensaje: '¡Hola! Sam acaba de picarle al botón en su página: "Sí te extraño así como tú a mí ❤️"',

          console.warn(e);

          setIsSendingMiss(false);
          setMissFeedback(true);
          setTimeout(() => setMissFeedback(false), 4500);

      };

      // Sam's custom message to email state

      const [isSendingSamMsg, setIsSendingSamMsg] = useState(false);
      const [samMsgFeedback, setSamMsgFeedback] = useState(false);
      const [sentNotes, setSentNotes] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('sam_sent_notes') || '[]');
        } catch (e) {
          return [];
        }
      });

      const handleSendSamMessage = async (e) => {
        if (e) e.preventDefault();
        if (!samMessage.trim()) return;

        setIsSendingSamMsg(true);
        const noteObj = {
          id: Date.now().toString(),
          text: samMessage.trim(),
          mood: samMood,
          date: new Date().toLocaleDateString('es-ES'),
          time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })

        try {
          await fetch('https://formsubmit.co/ajax/oswaldohernandezordonez7@gmail.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },

              _subject: `💌 ¡Nuevo mensajito de Sam! [${samMood}]`,

              Emocion_o_Tema: samMood,
              Mensaje_de_Sam: samMessage.trim(),
              Fecha: noteObj.date,
              Hora: noteObj.time

          localStorage.setItem('sam_sent_notes', JSON.stringify(updatedNotes));

          setSamMsgFeedback(true);

            spread: 80,
            origin: { y: 0.6 },
            colors: ['#F43F5E', '#FB7185', '#FDA4AF', '#FFE4E6', '#E11D48']

        } catch (err) {
          console.warn(err);
          setSamMsgFeedback(true);
        } finally {
          setIsSendingSamMsg(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const clean = passwordInput.toLowerCase().trim().replace(/[.,!¡¿?]/g, '').replace(/\s+/g, ' ');
        if (clean === 'te amo sam') {
          confetti({
            particleCount: 90,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#F43F5E', '#FB7185', '#FDA4AF', '#FFE4E6']

        const audio = audioRef.current;

          audio.pause();
          setIsMusicPlaying(false);

          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise

                setIsMusicPlaying(true);

                console.warn("Audio play prevented:", err);

                  <label className="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1.5 ml-1">
                    Contraseña de amor
                  </label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={passwordInput}
                      onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(''); }}

                  <p className="font-script text-2xl text-rose-500 mb-1">Nuestras risas y miradas en movimiento</p>
                  <h2 className="font-romantic text-3xl sm:text-4xl font-bold text-neutral-900">Cine de Nuestro Amor</h2>
                </div>
                <button
                  onClick={() => setIsUploadVideoOpen(true)}
                  className="rounded-xl bg-neutral-900 px-4 py-2 text-xs font-medium text-white hover:bg-neutral-800 self-start"
                >
                  🎥 Subir nuevo video
                </button>
              </div>

              {videos.length > 0 && selectedVideo && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  <div className="lg:col-span-2 rounded-2xl bg-black p-3 shadow-2xl">
                    <div className="aspect-video w-full rounded-xl overflow-hidden bg-neutral-950 flex items-center justify-center">
                      {selectedVideo.type === 'embed' ? (
                        <iframe src={selectedVideo.url} className="w-full h-full border-0" allowFullScreen />
                      ) : (
                        <video controls key={selectedVideo.url} className="w-full h-full object-contain">
                          <source src={selectedVideo.url} type="video/mp4" />
                        </video>
                      )}
                    </div>
                    <div className="p-4 text-white">
                      <h3 className="font-romantic text-2xl font-bold text-rose-100">{selectedVideo.title}</h3>
                      <p className="text-sm text-stone-300 mt-2 font-light">{selectedVideo.caption}</p>
                    </div>
                  </div>
                  <div className="space-y-2">
                    <p className="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Videos guardados ({videos.length})</p>
                    {videos.map(v => (
                      <div
                        key={v.id}
                        onClick={() => setSelectedVideo(v)}
                        className={`p-3 rounded-xl border cursor-pointer transition-all ${v.id === selectedVideo.id ? 'bg-white border-rose-300 shadow-md' : 'bg-white/60 border-rose-100 hover:bg-white'}`}
                      >
                        <h4 className="text-sm font-semibold text-neutral-900 truncate">{v.title}</h4>
                        <p className="text-xs text-neutral-500 line-clamp-1 mt-0.5">{v.caption}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </section>
          </main>

          {/* Modal Quote Opened */}
          {currentQuoteNote && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setCurrentQuoteNote(null)}>
              <div className="w-full max-w-md rounded-2xl letter-paper p-8 shadow-2xl border-2 border-rose-200 text-center" onClick={e => e.stopPropagation()}>
                <span className="text-3xl block mb-2">💌</span>
                <p className="font-script text-xl text-rose-600 mb-2">Mensajito de amor</p>
                <blockquote className="font-romantic text-2xl font-bold text-neutral-900 mb-6">“{currentQuoteNote.text}”</blockquote>
                <div className="text-xs text-neutral-500 mb-6">{currentQuoteNote.tag || 'Para Sam'}</div>
                <div className="flex justify-center gap-3">
                  <button onClick={pullQuoteFromJar} className="rounded-lg bg-rose-600 px-4 py-2 text-xs font-medium text-white hover:bg-rose-700">
                    🔄 Sacar otra frase
                  </button>
                  <button onClick={() => setCurrentQuoteNote(null)} className="rounded-lg bg-stone-200 px-4 py-2 text-xs font-medium text-stone-700 hover:bg-stone-300">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Read Letter */}
          {selectedLetter && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setSelectedLetter(null)}>
              <div className="w-full max-w-2xl rounded-2xl letter-paper p-8 shadow-2xl border border-stone-300 my-8 max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-stone-200">
                  <div>
                    <span className="text-xs text-stone-500">{selectedLetter.category} · {selectedLetter.date}</span>
                    <h3 className="font-romantic text-3xl font-bold text-stone-900">{selectedLetter.title}</h3>
                  </div>
                  <button onClick={() => setSelectedLetter(null)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">×</button>
                </div>
                <div className="text-stone-800 leading-relaxed font-light whitespace-pre-wrap mb-8 text-base">
                  {selectedLetter.content}
                </div>
                <div className="pt-4 border-t border-stone-200 flex justify-between items-center text-rose-600 font-romantic text-lg italic">
                  <span>Siempre tuyo con amor ❤️</span>
                  <button onClick={() => setSelectedLetter(null)} className="rounded-lg bg-stone-800 px-4 py-2 text-xs font-medium text-white hover:bg-stone-900">
                    Cerrar carta
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Write Letter */}
          {isWriteLetterOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setIsWriteLetterOpen(false)}>
              <div className="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <h3 className="font-romantic text-2xl font-bold text-neutral-900 mb-4">Escribir carta para Sam</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newLetterTitle || !newLetterContent) return;
                  saveAndSetLetters([{
                    id: String(Date.now()),
                    title: newLetterTitle,
                    category: newLetterCategory,
                    content: newLetterContent,
                    date: new Date().toLocaleDateString('es-ES')
                  }, ...letters]);
                  setNewLetterTitle('');
                  setNewLetterContent('');
                  setIsWriteLetterOpen(false);
                }} className="space-y-4">
                  <input
                    required
                    type="text"
                    value={newLetterTitle}
                    onChange={e => setNewLetterTitle(e.target.value)}
                    placeholder="Título de la carta..."
                    className="w-full rounded-xl border border-neutral-200 p-2.5 text-sm focus:border-rose-400 focus:outline-none"
                  />
                  <select
                    value={newLetterCategory}
                    onChange={e => setNewLetterCategory(e.target.value)}
                    className="w-full rounded-xl border border-neutral-200 p-2.5 text-sm focus:border-rose-400 focus:outline-none"
                  >
                    <option value="romantica">Carta Romántica</option>
                    <option value="promesa">Promesa de Amor</option>
                    <option value="recuerdo">Recuerdos Inolvidables</option>
                    <option value="especial">Momento Especial</option>
                  </select>
                  <textarea
                    required
                    rows={6}
                    value={newLetterContent}
                    onChange={e => setNewLetterContent(e.target.value)}
                    placeholder="Escribe todo lo que sientes aquí..."
                    className="w-full rounded-xl border border-neutral-200 p-2.5 text-sm focus:border-rose-400 focus:outline-none"
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsWriteLetterOpen(false)} className="rounded-xl px-4 py-2 text-xs text-neutral-600">Cancelar</button>
                    <button type="submit" className="rounded-xl bg-rose-600 px-5 py-2 text-xs font-semibold text-white hover:bg-rose-700">Guardar carta</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Photo Upload */}
          {isUploadPhotoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setIsUploadPhotoOpen(false)}>
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <h3 className="font-romantic text-2xl font-bold text-neutral-900 mb-4">Agregar Foto para Sam</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newPhotoUrl) return;
                  saveAndSetPhotos([{
                    id: String(Date.now()),
                    url: newPhotoUrl,
                    caption: newPhotoCaption || 'Un momento inolvidable contigo',
                    date: newPhotoDate || 'Hoy y siempre',
                    location: newPhotoLocation || 'Juntos'
                  }, ...photos]);
                  setNewPhotoUrl('');
                  setNewPhotoCaption('');
                  setIsUploadPhotoOpen(false);
                }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">Subir archivo o foto</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = () => setNewPhotoUrl(reader.result);
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="block w-full text-xs text-neutral-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-rose-50 file:text-rose-700"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">O ruta de la foto en tu repositorio (ej. fotos/foto1.jpg) o enlace</label>
                    <input
                      type="text"
                      placeholder="Ej: fotos/foto1.jpg o ./imagen.png o https://..."
                      value={newPhotoUrl || ''}
                      onChange={e => setNewPhotoUrl(e.target.value)}
                      className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                    />
                  </div>
                  {newPhotoUrl && (
                    <div className="h-32 w-full rounded-lg overflow-hidden border">
                      <img src={newPhotoUrl} className="w-full h-full object-cover" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                    </div>
                  )}
                  <input
                    type="text"
                    required
                    value={newPhotoCaption}
                    onChange={e => setNewPhotoCaption(e.target.value)}
                    placeholder="Dedicatoria..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsUploadPhotoOpen(false)} className="rounded-lg px-3 py-1.5 text-xs text-neutral-600">Cancelar</button>
                    <button type="submit" disabled={!newPhotoUrl} className="rounded-lg bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white disabled:opacity-50">Guardar foto</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Video Upload */}
          {isUploadVideoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={() => setIsUploadVideoOpen(false)}>
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <h3 className="font-romantic text-2xl font-bold text-neutral-900 mb-4">Subir Video para Sam</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!newVideoUrl) return;
                  let finalUrl = newVideoUrl;
                  let finalType = 'url';
                  if (finalUrl.includes('youtube.com') || finalUrl.includes('youtu.be')) {
                    finalType = 'embed';
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = finalUrl.match(regExp);
                    if (match && match[2].length === 11) finalUrl = `https://www.youtube.com/embed/${match[2]}`;
                  }
                  const created = {
                    id: String(Date.now()),
                    title: newVideoTitle || 'Video de nuestro amor',
                    url: finalUrl,
                    caption: newVideoCaption || 'Momentos juntos',
                    date: new Date().toLocaleDateString('es-ES'),
                    type: finalType
                  };
                  saveAndSetVideos([created, ...videos]);
                  setSelectedVideo(created);
                  setNewVideoTitle('');
                  setNewVideoUrl('');
                  setIsUploadVideoOpen(false);
                }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">Subir archivo de video desde tu dispositivo</label>
                    <input
                      type="file"
                      accept="video/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) {
                          setNewVideoUrl(URL.createObjectURL(file));
                          if (!newVideoTitle) setNewVideoTitle(file.name.replace(/\.[^/.]+$/, ''));
                        }
                      }}
                      className="block w-full text-xs text-neutral-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-rose-50 file:text-rose-700"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-700 mb-1">O ruta relativa (ej. videos/video1.mp4) o YouTube</label>
                    <input
                      type="text"
                      placeholder="Ej: videos/video1.mp4 o https://youtube.com/..."
                      value={newVideoUrl}
                      onChange={e => setNewVideoUrl(e.target.value)}
                      className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                    />
                  </div>
                  <input
                    type="text"
                    required
                    value={newVideoTitle}
                    onChange={e => setNewVideoTitle(e.target.value)}
                    placeholder="Título del video..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <textarea
                    rows={2}
                    value={newVideoCaption}
                    onChange={e => setNewVideoCaption(e.target.value)}
                    placeholder="Dedicatoria..."
                    className="w-full rounded-lg border border-neutral-200 p-2 text-xs focus:outline-none"
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsUploadVideoOpen(false)} className="rounded-lg px-3 py-1.5 text-xs text-neutral-600">Cancelar</button>
                    <button type="submit" disabled={!newVideoUrl} className="rounded-lg bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white disabled:opacity-50">Guardar video</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Lightbox Photo */}
          {activePhoto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md" onClick={() => setActivePhoto(null)}>
              <div className="max-w-3xl w-full bg-white rounded-2xl p-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="max-h-[70vh] bg-neutral-950 rounded-xl overflow-hidden flex items-center justify-center">
                  <img src={activePhoto.url} className="max-h-[70vh] object-contain" />
                </div>
                <div className="mt-3 flex justify-between items-center">
                  <div>
                    <h3 className="font-romantic text-2xl font-bold text-neutral-900">{activePhoto.caption}</h3>
                    <p className="text-xs text-neutral-500">{activePhoto.date} · {activePhoto.location}</p>
                  </div>
                  <button onClick={() => setActivePhoto(null)} className="rounded-lg bg-neutral-900 px-4 py-2 text-xs text-white">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-rose-100 bg-[#FAF7F5] py-8 px-4 text-center text-xs text-neutral-500 font-light">
            <p className="font-romantic text-lg font-bold text-neutral-800 mb-1">Para Sam ❤️</p>
            <p>Hecho con amor infinito, paciencia y cada latido de mi corazón.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
